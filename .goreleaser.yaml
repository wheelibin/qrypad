project_name: qrypad
builds:
  - main: ./
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/wheelibin/qrypad/internal/constants.Version={{ .Version }}
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
release:
  github:
    owner: wheelibin
    name: qrypad
