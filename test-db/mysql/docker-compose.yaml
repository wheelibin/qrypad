services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: qrypad
      MYSQL_USER: qrypad
      MYSQL_PASSWORD: qrypad
    ports:
      - "50306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "--protocol=tcp",
          "-u",
          "qrypad",
          "-pqrypad",
          "--silent",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 10s

volumes:
  mysql_data:
