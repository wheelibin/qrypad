name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install X11 headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install X11 headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Run unit tests
        run: go test ./...

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install X11 headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
      - name: Start Postgres
        working-directory: test-db/postgres
        run: docker compose up -d --wait
      - name: Start MySQL
        working-directory: test-db/mysql
        run: docker compose up -d --wait
      - name: Seed SQLite
        run: |
          sudo apt-get install -y sqlite3
          sqlite3 test-db/sqlite/sqlite.db < test-db/sqlite/init.sql
      - name: Run integration tests
        run: go test -tags=integration -count=1 ./internal/db/...
      - name: Dump container logs on failure
        if: failure()
        run: |
          cd test-db/postgres && docker compose logs db || true
          cd test-db/mysql && docker compose logs mysql || true
